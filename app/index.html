<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice — Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app" id="appRoot">
  <aside class="controls" id="controlsPanel">
    <header class="brand">
      <h1>NEON <span>VICE</span></h1>
      <p class="tag">Cover art maker — your photo, a poster-grid cover, one PNG.</p>
    </header>

    <section class="group">
      <h2>1 · Photos</h2>
      <label class="fileBtn">Add your photos
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
      </label>
      <div class="thumbRow" id="thumbRow" aria-label="Loaded photos"></div>
      <div class="rowBtns">
        <button id="fillAllBtn" type="button">Fill every photo panel</button>
        <button id="cycleBtn" type="button">Mix photos &amp; scenes</button>
      </div>
    </section>

    <section class="group">
      <h2>2 · Panel</h2>
      <p class="hint">Click a panel on the cover, then drag the photo inside it.</p>
      <div class="panelGrid" id="panelGrid"></div>
      <label class="slider">Zoom <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1"></label>
      <label class="slider">Move across <input id="dxRange" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label>
      <label class="slider">Move down <input id="dyRange" type="range" min="-0.5" max="0.5" step="0.005" value="0"></label>
    </section>

    <section class="group">
      <h2>3 · Words &amp; colour</h2>
      <label class="field">Game title <input id="titleInput" type="text" maxlength="24" value="NEON VICE"></label>
      <label class="field">Tagline <input id="taglineInput" type="text" maxlength="44" value="VICE SHORES NEVER SLEEPS"></label>
      <div class="rowBtns" id="gradeRow" role="group" aria-label="Colour grade">
        <button type="button" data-grade="sunset" class="gradeBtn isOn">Sunset</button>
        <button type="button" data-grade="neon" class="gradeBtn">Neon</button>
        <button type="button" data-grade="noir" class="gradeBtn">Noir</button>
      </div>
    </section>

    <section class="group">
      <h2>4 · Export PNG</h2>
      <div class="rowBtns" id="sizeRow" role="group" aria-label="Export size">
        <button type="button" data-size="1080x1080" class="sizeBtn">Square 1080×1080</button>
        <button type="button" data-size="1080x1350" class="sizeBtn">Portrait 1080×1350</button>
        <button type="button" data-size="1920x1080" class="sizeBtn isOn">Wide 1920×1080</button>
      </div>
      <button id="exportBtn" type="button" class="exportBtn">Export cover PNG</button>
      <p id="status" role="status" class="status"></p>
    </section>
  </aside>

  <section class="stage">
    <canvas id="coverCanvas" width="1920" height="1080" aria-label="Live cover preview"></canvas>
    <p class="stageHint">Live preview — drag a photo panel to reposition it, use the sliders to zoom and crop.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
